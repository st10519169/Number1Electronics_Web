<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Inquiry | Number 1 Electronics</title>
    <meta name="description" content="Check service availability, product cost estimates, and volunteer opportunities at Number 1 Electronics.">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <header>
        <nav class="nav-bar">
            <a href="index.html">Home</a>
            <a href="enquiry.html" class="active">Service Enquiry</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main class="form-container">
        <h1>Product & Service Enquiry</h1>
        <p>Fill out the form below to check stock availability, request pricing, or apply for sponsorship.</p>

        <form id="enquiryForm" action="https://httpbin.org" method="POST">
            <div class="form-group">
                <label for="clientName">Full Name *</label>
                <input type="text" id="clientName" name="clientName" required>
                <span class="error-msg" id="nameError"></span>
            </div>

            <div class="form-group">
                <label for="clientEmail">Email Address *</label>
                <input type="email" id="clientEmail" name="clientEmail" required>
                <span class="error-msg" id="emailError"></span>
            </div>

            <div class="form-group">
                <label for="inquiryType">Inquiry Purpose *</label>
                <select id="inquiryType" name="inquiryType" required>
                    <option value="">-- Select Purpose --</option>
                    <option value="cost">Product Cost Estimations</option>
                    <option value="availability">Stock & Service Availability</option>
                    <option value="volunteer">Become a Volunteer / Sponsor</option>
                </select>
                <span class="error-msg" id="typeError"></span>
            </div>

            <div class="form-group">
                <label for="details">Additional Details *</label>
                <textarea id="details" name="details" rows="5" required></textarea>
                <span class="error-msg" id="detailsError"></span>
            </div>

            <button type="submit">Submit Inquiry</button>
        </form>

        <div id="responseContainer" class="response-box" style="display: none;"></div>
    </main>

    <script src="assets/js/main.js"></script>
    <script>
        document.getElementById("enquiryForm").addEventListener("submit", function(e) {
            e.preventDefault();
            
            document.querySelectorAll(".error-msg").forEach(el => el.textContent = "");
            
            let isValid = true;
            const name = document.getElementById("clientName").value.trim();
            const email = document.getElementById("clientEmail").value.trim();
            const type = document.getElementById("inquiryType").value;
            const details = document.getElementById("details").value.trim();

            if (name.length < 3) {
                document.getElementById("nameError").textContent = "Name must be at least 3 letters long.";
                isValid = false;
            }
            if (!email.includes("@") || !email.includes(".")) {
                document.getElementById("emailError").textContent = "Please enter a valid email address.";
                isValid = false;
            }
            if (type === "") {
                document.getElementById("typeError").textContent = "Please select an inquiry type.";
                isValid = false;
            }
            if (details.length < 15) {
                document.getElementById("detailsError").textContent = "Details must be at least 15 characters long.";
                isValid = false;
            }

            if (!isValid) return;

            const responseBox = document.getElementById("responseContainer");
            responseBox.style.display = "block";
            responseBox.style.backgroundColor = "#fff3cd";
            responseBox.textContent = "Processing inquiry details securely...";

            fetch("https://httpbin.org", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, email, type, details })
            })
            .then(res => res.json())
            .then(data => {
                responseBox.style.backgroundColor = "#d4edda";
                responseBox.style.color = "#155724";
                responseBox.innerHTML = `<h3>Inquiry Logged!</h3><p>Thank you, <strong>${name}</strong>. Your ticket regarding <strong>${type}</strong> has been received. Pricing/availability details will be sent to <strong>${email}</strong>.</p>`;
            })
            .catch(err => {
                responseBox.style.backgroundColor = "#f8d7da";
                responseBox.style.color = "#721c24";
                responseBox.textContent = "Submission failed. Please check your network connection.";
            });
        });
    </script>
</body>
</html>
